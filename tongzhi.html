<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宁山风景区 · 官方通知</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8e0d6;
            font-family: 'Georgia', 'Times New Roman', '楷体', 'KaiTi', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .notice-container {
            max-width: 680px;
            width: 100%;
            background: #fcf9f5;
            border-radius: 16px;
            padding: 40px 44px 36px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid #e8e0d8;
            position: relative;
        }

        .notice-header {
            text-align: center;
            border-bottom: 2px solid #e0d8d0;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .notice-header .title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: 6px;
            font-family: 'Georgia', serif;
        }

        .notice-header .meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #8a8278;
            letter-spacing: 1px;
            flex-wrap: wrap;
        }

        .notice-header .meta .date {
            font-weight: 500;
            color: #5a7a5a;
        }

        .notice-header .meta .tag {
            background: #e8e4dc;
            padding: 2px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #5a524a;
        }

        .notice-body {
            font-size: 1.05rem;
            line-height: 2;
            color: #2a241e;
            letter-spacing: 0.3px;
        }

        .notice-body p {
            text-indent: 2em;
            margin-bottom: 1rem;
        }

        .notice-body p:last-of-type {
            margin-bottom: 0;
        }

        .notice-body .signature {
            text-align: right;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f0ece6;
            font-size: 0.95rem;
            color: #5a524a;
            text-indent: 0;
            letter-spacing: 1px;
        }

        .notice-body .signature .org {
            font-weight: 700;
            color: #1a2a3a;
        }

        .notice-body .signature .seal {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.7rem;
            color: #8a8278;
            letter-spacing: 4px;
            border: 1px solid #d0c8c0;
            padding: 2px 16px;
            border-radius: 30px;
        }

        /* ===== 左下角盖章（像印上去的） ===== */
        .stamp-left {
            position: absolute;
            bottom: 28px;
            left: 34px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            opacity: 0.85;
            pointer-events: none;
        }

        .stamp-left img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .notice-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #f0ece6;
            font-size: 0.7rem;
            color: #c4b8a8;
            letter-spacing: 6px;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 14px;
            }
            .notice-container {
                padding: 28px 20px 24px;
                border-radius: 12px;
            }
            .notice-header .title {
                font-size: 1.3rem;
                letter-spacing: 4px;
            }
            .notice-body {
                font-size: 0.95rem;
            }
            .notice-header .meta {
                font-size: 0.75rem;
                gap: 14px;
            }
            .stamp-left {
                width: 64px;
                height: 64px;
                bottom: 18px;
                left: 16px;
            }
        }

        @media (max-width: 400px) {
            .notice-container {
                padding: 20px 14px 18px;
            }
            .notice-header .title {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
            .notice-body {
                font-size: 0.88rem;
            }
            .notice-header .meta .tag {
                display: none;
            }
            .stamp-left {
                width: 52px;
                height: 52px;
                bottom: 12px;
                left: 10px;
            }
        }
    </style>
</head>
<body>

<div class="notice-container">

    <div class="notice-header">
        <div class="title">公 告</div>
        <div class="meta">
            <span class="date">宁山风景区管理处</span>
            <span class="tag">官方通知</span>
            <span class="date">2018年10月18日</span>
        </div>
    </div>

    <div class="notice-body">

        <p>经景区管委会审慎研究决定，自即日起，<strong>停止对宁山后山古庙工程的一切投资建设</strong>。</p>

        <p>目前，已对施工现场进行了全面清理与封闭管理，禁止游客进入后山区域。景区其他区域正常开放，欢迎广大游客前来游览观光。</p>

        <p>感谢社会各界对宁山风景区建设的关注与支持。</p>

        <div class="signature">
            <div class="org">宁山风景区管理处</div>
            <div>2018年10月18日</div>
            <div class="seal">宁 山 风 景 区 管 委 会</div>
        </div>

    </div>

    <!-- ===== 左下角盖章（像印上去的） ===== -->
    <div class="stamp-left">
        <img src="images/gaizhang.jpg" alt="公章" />
    </div>

    <div class="notice-footer">
        —— 宁山风景区 · 官方通知 ——
    </div>

</div>
<!-- 独立页码小标 -->
<div style="position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #ffffff; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); font-family: 'Courier New', monospace; letter-spacing: 1px; z-index: 999; user-select: none;">
    9 / 20
</div>

</body>
</html>

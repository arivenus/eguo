<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推理进度条</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2c1810;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Georgia', 'Times New Roman', '楷体', 'KaiTi', serif;
        }

        .checklist-container {
            max-width: 680px;
            width: 100%;
            background: #f5efe6;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(235, 215, 190, 0.3) 0%, transparent 60%),
                linear-gradient(180deg, #f5efe6 0%, #e8ddd0 100%);
            border-radius: 18px;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.6),
                0 0 0 2px #8b7355,
                0 0 0 6px #d4c4b0,
                0 0 0 8px #8b7355;
            padding: 30px 28px 28px;
            position: relative;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 2px dashed #c4b09a;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ===== Tab 切换 ===== */
        .tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #e8ddd0;
            border-radius: 40px;
            padding: 4px;
            border: 1px solid #d4c4b0;
        }

        .tab-btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: #b8a692;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #f5efe6;
            color: #4a2f1f;
            font-size: 1.15rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .tab-btn.inactive {
            color: #b8a692;
            font-size: 0.95rem;
        }

        .tab-btn.inactive:hover {
            color: #7a6a5a;
            background: rgba(255,255,255,0.2);
        }

        .tab-btn .egg-icon {
            font-size: 0.9rem;
        }

        .tab-btn.active .egg-icon {
            font-size: 1.05rem;
        }

        /* ===== 彩蛋计数 ===== */
        .egg-badge {
            font-size: 0.7rem;
            background: #b8860b;
            color: #fff8e7;
            padding: 1px 10px;
            border-radius: 30px;
            margin-left: 4px;
            font-weight: 600;
            display: inline-block;
        }

        .tab-btn.inactive .egg-badge {
            background: #b8a692;
            color: #f5efe6;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #8a7a6a;
            background: #e8ddd0;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* ===== 进度条 ===== */
        .progress-bar-wrap {
            width: 100%;
            height: 8px;
            background: #ddd0c0;
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #5a7a4a;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .progress-bar-fill.egg-progress {
            background: #b8860b;
        }

        /* ===== 页码网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .page-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 10px 4px;
            border: 2px solid #d4c4b0;
            transition: 0.2s;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: #3d281c;
            font-weight: 500;
        }

        .page-item:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: #b8a080;
        }

        .page-item.checked {
            background: #d4e8d0;
            border-color: #5a7a4a;
        }

        .page-item.egg-checked {
            background: #f5ecce;
            border-color: #b8860b;
        }

        .page-item .num {
            font-weight: 700;
            color: #4a2f1f;
        }

        .page-item .check-mark {
            font-size: 1rem;
            opacity: 0;
            transition: 0.2s;
        }

        .page-item.checked .check-mark {
            opacity: 1;
            color: #3a7a2a;
        }

        .page-item.egg-checked .check-mark {
            opacity: 1;
            color: #b8860b;
        }

        /* ===== 底部按钮 ===== */
        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 2px dashed #c4b09a;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background: #d4c4b0;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #3d281c;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .btn:hover {
            background: #c4b09a;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-reset {
            background: #d4b8a8;
        }

        .btn-reset:hover {
            background: #c4a898;
        }

        .btn-back {
            background: #b8c8d4;
        }

        .btn-back:hover {
            background: #a8b8c4;
        }

        .watermark {
            text-align: center;
            margin-top: 12px;
            font-size: 0.7rem;
            color: #b8a692;
            letter-spacing: 2px;
            font-style: italic;
        }

        /* ===== 移动端 ===== */
        @media (max-width: 580px) {
            .checklist-container {
                padding: 18px 16px 20px;
            }
            .tab-btn {
                padding: 6px 14px;
                font-size: 0.85rem;
            }
            .tab-btn.active {
                font-size: 1rem;
            }
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }
            .page-item {
                padding: 8px 2px;
                font-size: 0.8rem;
            }
            .btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }
            .progress-text {
                font-size: 0.75rem;
                padding: 3px 12px;
            }
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .page-item {
                padding: 6px 2px;
                font-size: 0.75rem;
                border-radius: 8px;
            }
            .checklist-container {
                padding: 14px 10px 16px;
            }
            .tab-btn {
                padding: 4px 10px;
                font-size: 0.75rem;
            }
            .tab-btn.active {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="checklist-container">

    <!-- 头部 -->
    <div class="header">
        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-mode="clue" id="clueTab"> 线索梳理</button>
            <button class="tab-btn inactive" data-mode="egg" id="eggTab"> 隐藏彩蛋 <span class="egg-badge" id="eggBadge">0</span></button>
        </div>
        <span class="progress-text" id="progressText">0 / 36</span>
    </div>

    <!-- 进度条 -->
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <!-- 页码网格 -->
    <div class="grid" id="gridContainer"></div>

    <!-- 底部按钮 -->
    <div class="footer-actions">
        <button class="btn btn-back" id="backBtn">◀ 返回</button>
        <button class="btn btn-reset" id="resetBtn">↺ 重置全部</button>
    </div>

    <div class="watermark">——页码梳理 ——</div>
</div>

<script>
    // ============================================================
    // 配置
    // ============================================================
    const TOTAL_PAGES = 20;
    const STORAGE_KEY = 'diary_checklist_data';
    const EGG_STORAGE_KEY = 'diary_egg_data';

    // 彩蛋页码（可以自定义）
    const EGG_PAGES = [1,2,3,4,5];

    // ============================================================
    // 状态
    // ============================================================
    let currentMode = 'clue'; // 'clue' | 'egg'
    let clueData = loadData(STORAGE_KEY, TOTAL_PAGES);
    let eggData = loadData(EGG_STORAGE_KEY, EGG_PAGES.length);

    // ============================================================
    // 数据管理
    // ============================================================
    function loadData(key, length) {
        try {
            const raw = localStorage.getItem(key);
            if (raw) {
                const data = JSON.parse(raw);
                if (Array.isArray(data) && data.length === length) {
                    return data;
                }
            }
        } catch (e) {}
        return new Array(length).fill(false);
    }

    function saveData(key, data) {
        localStorage.setItem(key, JSON.stringify(data));
    }

    // ============================================================
    // DOM 引用
    // ============================================================
    const grid = document.getElementById('gridContainer');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const clueTab = document.getElementById('clueTab');
    const eggTab = document.getElementById('eggTab');
    const eggBadge = document.getElementById('eggBadge');

    // ============================================================
    // 渲染
    // ============================================================
    function render() {
        const isEggMode = (currentMode === 'egg');
        const data = isEggMode ? eggData : clueData;
        const total = isEggMode ? EGG_PAGES.length : TOTAL_PAGES;
        const displayPages = isEggMode ? EGG_PAGES : Array.from({ length: TOTAL_PAGES }, (_, i) => i + 1);

        // 更新 Tab 样式
        clueTab.className = 'tab-btn' + (isEggMode ? ' inactive' : ' active');
        eggTab.className = 'tab-btn' + (isEggMode ? ' active' : ' inactive');

        // 更新彩蛋计数
        const eggFound = eggData.filter(Boolean).length;
        eggBadge.textContent = eggFound;

        // 清空网格
        grid.innerHTML = '';
        grid.className = 'grid mode-transition';

        // 渲染每个页码
        for (let i = 0; i < displayPages.length; i++) {
            const pageNum = displayPages[i];
            const isChecked = data[i];

            const div = document.createElement('div');
            div.className = 'page-item';

            if (isEggMode && isChecked) {
                div.classList.add('egg-checked');
            } else if (!isEggMode && isChecked) {
                div.classList.add('checked');
            }

            div.dataset.index = i;

            div.innerHTML = `
                <span class="num">${pageNum}</span>
                <span class="check-mark">✓</span>
            `;

            div.addEventListener('click', function() {
                toggleItem(i);
            });

            grid.appendChild(div);
        }

        // 更新进度
        const checkedCount = data.filter(Boolean).length;
        const totalCount = displayPages.length;
        const percent = Math.round((checkedCount / totalCount) * 100);
        progressText.textContent = checkedCount + ' / ' + totalCount;

        // 进度条颜色
        progressFill.className = 'progress-bar-fill' + (isEggMode ? ' egg-progress' : '');
        progressFill.style.width = percent + '%';

        // 触发重绘动画
        setTimeout(() => {
            grid.className = 'grid';
        }, 50);
    }

    // ============================================================
    // 交互
    // ============================================================
    function toggleItem(index) {
        if (currentMode === 'egg') {
            eggData[index] = !eggData[index];
            saveData(EGG_STORAGE_KEY, eggData);
        } else {
            clueData[index] = !clueData[index];
            saveData(STORAGE_KEY, clueData);
        }
        render();
    }

    // ============================================================
    // 切换模式（点击 Tab）
    // ============================================================
    clueTab.addEventListener('click', function() {
        if (currentMode === 'clue') return;
        currentMode = 'clue';
        render();
    });

    eggTab.addEventListener('click', function() {
        if (currentMode === 'egg') return;
        currentMode = 'egg';
        render();
    });

    // ============================================================
    // 重置
    // ============================================================
    document.getElementById('resetBtn').addEventListener('click', function() {
        const modeName = (currentMode === 'egg') ? '彩蛋' : '线索';
        if (confirm('确定要重置「' + modeName + '」模式下的所有勾选吗？')) {
            if (currentMode === 'egg') {
                eggData = new Array(EGG_PAGES.length).fill(false);
                saveData(EGG_STORAGE_KEY, eggData);
            } else {
                clueData = new Array(TOTAL_PAGES).fill(false);
                saveData(STORAGE_KEY, clueData);
            }
            render();
        }
    });

    // ============================================================
    // 返回
    // ============================================================
    document.getElementById('backBtn').addEventListener('click', function() {
        window.location.href = 'index.html';
    });

    // ============================================================
    // 启动
    // ============================================================
    render();
</script>

</body>
</html>

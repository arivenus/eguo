<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5efe8;
            font-family: 'Georgia', 'Times New Roman', '楷体', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 30% 20%, rgba(220, 200, 180, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(200, 180, 160, 0.2) 0%, transparent 50%);
        }

        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(240, 235, 228, 0.96);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            transition: opacity 0.6s ease;
        }

        .lock-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .lock-box {
            background: rgba(255, 252, 248, 0.92);
            border: 1px solid rgba(200, 180, 160, 0.15);
            border-radius: 20px;
            padding: 40px 44px 36px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.04), 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        .lock-box .lock-icon {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 6px;
            opacity: 0.5;
        }

        .lock-box .lock-title {
            font-size: 1.3rem;
            color: #4a3a2e;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .lock-box .lock-hint {
            font-size: 0.85rem;
            color: rgba(120, 100, 80, 0.35);
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .lock-box .lock-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 30px;
            border: 1px solid rgba(180, 160, 140, 0.15);
            background: rgba(255, 252, 248, 0.6);
            color: #3a2e24;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            font-family: 'Georgia', serif;
            letter-spacing: 8px;
            transition: 0.3s;
        }

        .lock-box .lock-input:focus {
            border-color: rgba(140, 120, 100, 0.25);
            box-shadow: 0 0 20px rgba(120, 100, 80, 0.04);
        }

        .lock-box .lock-input::placeholder {
            color: rgba(160, 140, 120, 0.2);
            letter-spacing: 4px;
            font-size: 0.9rem;
        }

        .lock-box .lock-btn {
            margin-top: 16px;
            padding: 12px 32px;
            border-radius: 30px;
            border: 1px solid rgba(180, 160, 140, 0.10);
            background: rgba(200, 180, 160, 0.08);
            color: #4a3a2e;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Georgia', serif;
            letter-spacing: 6px;
            width: 100%;
        }

        .lock-box .lock-btn:hover {
            background: rgba(200, 180, 160, 0.15);
            border-color: rgba(180, 160, 140, 0.15);
        }

        .lock-box .lock-error {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #b05545;
            letter-spacing: 2px;
            min-height: 24px;
        }

        .app-container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 252, 248, 0.92);
            border: 1px solid rgba(200, 180, 160, 0.08);
            border-radius: 16px;
            padding: 28px 30px 24px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.02);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(200, 180, 160, 0.08);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-header .title {
            font-size: 1.2rem;
            color: #4a3a2e;
            letter-spacing: 6px;
            font-weight: 500;
        }

        .app-header .title .icon {
            margin-right: 8px;
            opacity: 0.4;
        }

        .app-header .count {
            font-size: 0.85rem;
            color: rgba(140, 120, 100, 0.3);
            letter-spacing: 3px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .photo-item {
            background: rgba(255, 252, 248, 0.5);
            border: 1px solid rgba(200, 180, 160, 0.06);
            border-radius: 12px;
            padding: 10px 10px 10px 10px;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .photo-item:hover {
            background: rgba(255, 252, 248, 0.9);
            border-color: rgba(200, 180, 160, 0.10);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .photo-item .photo-placeholder {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            background: rgba(240, 230, 220, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(200, 180, 160, 0.04);
        }

        .photo-item .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .photo-item .photo-date {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(140, 120, 100, 0.25);
            letter-spacing: 3px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(200, 180, 160, 0.04);
        }

        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(240, 235, 228, 0.92);
            backdrop-filter: blur(6px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            background: rgba(255, 252, 248, 0.95);
            border: 1px solid rgba(200, 180, 160, 0.08);
            border-radius: 16px;
            padding: 20px 20px 18px;
            position: relative;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        .lightbox-content .lightbox-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 1.6rem;
            color: rgba(140, 120, 100, 0.15);
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            z-index: 10;
        }

        .lightbox-content .lightbox-close:hover {
            color: rgba(140, 120, 100, 0.3);
            background: rgba(200, 180, 160, 0.04);
        }

        .lightbox-content .lightbox-image {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 10px;
            background: rgba(240, 230, 220, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(200, 180, 160, 0.04);
        }

        .lightbox-content .lightbox-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .lightbox-content .lightbox-date {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(140, 120, 100, 0.25);
            letter-spacing: 4px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(200, 180, 160, 0.04);
        }

        .lightbox-content .lightbox-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .lightbox-content .lightbox-nav button {
            padding: 8px 28px;
            border-radius: 30px;
            border: 1px solid rgba(200, 180, 160, 0.06);
            background: rgba(200, 180, 160, 0.04);
            color: rgba(140, 120, 100, 0.25);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Georgia', serif;
            letter-spacing: 4px;
        }

        .lightbox-content .lightbox-nav button:hover {
            background: rgba(200, 180, 160, 0.08);
            border-color: rgba(200, 180, 160, 0.08);
            color: rgba(140, 120, 100, 0.35);
        }

        .lightbox-content .lightbox-counter {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(160, 140, 120, 0.12);
            letter-spacing: 4px;
            margin-top: 6px;
        }

        @media (max-width: 600px) {
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .app-container {
                padding: 18px 16px 16px;
            }
            .lock-box {
                padding: 28px 24px 24px;
            }
            .lightbox-content {
                padding: 14px 14px 12px;
            }
            .lightbox-content .lightbox-image {
                aspect-ratio: 1/1;
            }
            .lock-box .lock-input {
                font-size: 1rem;
                padding: 12px 14px;
            }
        }

        @media (max-width: 400px) {
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }
            .app-header .title {
                font-size: 1rem;
            }
            .lock-box .lock-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="lock-screen" id="lockScreen">
        <div class="lock-box">
            <span class="lock-icon"></span>
            <div class="lock-title">输入密码解锁</div>
            <div class="lock-hint">— 母亲去世那天 —</div>
            <input type="password" class="lock-input" id="lockInput" placeholder="请输入六位数密码" maxlength="6" inputmode="numeric" />
            <button class="lock-btn" id="lockBtn">解 锁</button>
            <div class="lock-error" id="lockError"></div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="app-header">
            <span class="title"><span class="icon">📁</span> 照片</span>
            <span class="count">8 张</span>
        </div>
        <div class="photo-grid" id="photoGrid"></div>
    </div>

    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">✕</button>
            <div class="lightbox-image" id="lightboxImage"></div>
            <div class="lightbox-date" id="lightboxDate"></div>
            <div class="lightbox-nav">
                <button id="lightboxPrev">◀ 上一张</button>
                <button id="lightboxNext">下一张 ▶</button>
            </div>
            <div class="lightbox-counter" id="lightboxCounter"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 照片数据（8张）
        // ============================================================
        const photos = [
            { id: 1, date: '2015.3.17', url: 'images/150317.jpg' },
            { id: 2, date: '2015.4.12', url: 'images/150412.jpg' },
            { id: 3, date: '2015.5.3',  url: 'images/150503.jpg' },
            { id: 4, date: '2015.5.9',  url: 'images/150509.jpg' },
            { id: 5, date: '2015.6.10', url: 'images/150610.jpg' },
            { id: 6, date: '2015.6.25', url: 'images/150625.jpg' },
            { id: 7, date: '2015.6.26', url: 'images/150626.jpg' },
            { id: 8, date: '提示：游戏的开始',          url: 'images/mima.jpg' }
        ];

        // ============================================================
        // 密码验证
        // ============================================================
        const correctPassword = '150626';

        const lockScreen = document.getElementById('lockScreen');
        const lockInput = document.getElementById('lockInput');
        const lockBtn = document.getElementById('lockBtn');
        const lockError = document.getElementById('lockError');

        function unlock() {
            const input = lockInput.value.trim();
            if (input === correctPassword) {
                lockScreen.classList.add('hidden');
                lockError.textContent = '';
                lockInput.value = '';
            } else {
                lockError.textContent = '❌ 密码错误，请重试';
                lockInput.value = '';
                lockInput.focus();
                lockInput.style.borderColor = 'rgba(180, 100, 80, 0.2)';
                setTimeout(() => {
                    lockInput.style.borderColor = '';
                }, 800);
            }
        }

        lockBtn.addEventListener('click', unlock);
        lockInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                unlock();
            }
        });
        lockInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            if (this.value.length > 6) {
                this.value = this.value.slice(0, 6);
            }
        });

        // ============================================================
        // 渲染照片（显示真实图片）
        // ============================================================
        const photoGrid = document.getElementById('photoGrid');

        function renderPhotos() {
            photoGrid.innerHTML = photos.map((photo, index) => `
                <div class="photo-item" data-index="${index}">
                    <div class="photo-placeholder">
                        <img src="${photo.url}" alt="${photo.date || '照片'}" />
                    </div>
                    <div class="photo-date">${photo.date || '无日期'}</div>
                </div>
            `).join('');

            document.querySelectorAll('.photo-item').forEach((item) => {
                item.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    openLightbox(index);
                });
            });
        }

        renderPhotos();

        // ============================================================
        // 放大查看
        // ============================================================
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxDate = document.getElementById('lightboxDate');
        const lightboxCounter = document.getElementById('lightboxCounter');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const photo = photos[currentIndex];
            lightboxImage.innerHTML = `<img src="${photo.url}" alt="${photo.date || '照片'}" />`;
            lightboxDate.textContent = photo.date || '无日期';
            lightboxCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photos.length;
            updateLightbox();
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            updateLightbox();
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        document.addEventListener('keydown', function(e) {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowRight') { e.preventDefault(); nextPhoto(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevPhoto(); }
        });

        lightboxNext.addEventListener('click', function(e) {
            e.stopPropagation();
            nextPhoto();
        });

        lightboxPrev.addEventListener('click', function(e) {
            e.stopPropagation();
            prevPhoto();
        });

        // ============================================================
        // 初始化
        // ============================================================
        window.addEventListener('load', function() {
            setTimeout(() => lockInput.focus(), 300);
        });

          </script>
<!-- 独立页码小标 -->
<div style="position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #ffffff; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); font-family: 'Courier New', monospace; letter-spacing: 1px; z-index: 999; user-select: none;">
    15 / 20
</div>

</body>
</html>
